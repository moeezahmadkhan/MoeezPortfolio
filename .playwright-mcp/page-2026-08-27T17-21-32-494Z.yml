        - article [ref=e234]:
          - generic:
            - paragraph [ref=e235]: 140s — Pawlyse — research agent — mlend AI engineer
            - heading "Ten model calls, 140 seconds, six citations." [level=3] [ref=e236]: Ten model calls,140 seconds, six citations.
            - generic [ref=e237]:
              - paragraph [ref=e238]: A normal question to Pawlyse retrieves once and answers. Some questions deserve more than that, so there is a second path that behaves like a researcher instead of a lookup.
              - paragraph [ref=e239]: It plans six search angles with a cheap helper model, retrieves each from the pet's own record and from the live web, asks the helper what is still missing, retrieves that gap, and only then answers over the union with the main model — reporting what it drew on. Up to ten model calls, thirteen if it asks a clarifying question first.
              - paragraph [ref=e240]: That cost is why the path is off by default, and why it runs against a clock. The caller times out at 180 seconds, synthesis reserves 30 of those and overhead takes 10, which leaves about 140 seconds of actual research. Every stage is bounded by what remains. When the budget runs out, the answer is written from what was gathered, not extended until something breaks.
              - paragraph [ref=e241]: Answers carry at most six citations, at most four of them from the web, and nothing is cited past a cosine distance of 0.43. Nothing in this path is logged — not the question, not the sub-queries, not the retrieved record, not the answer. All four carry the owner's words or the animal's medical record.
            - generic [ref=e242]:
              - heading "The constraint" [level=4] [ref=e243]
              - paragraph [ref=e245]: "A fact the owner deletes has to stay deleted. A background extractor reads chat and writes durable facts, which means deleting one only works until the extractor sees the same message again. Deleted facts get a tombstone, so the extractor cannot re-create them and the assistant will not state them as known. The scope is written into the code rather than implied: tombstones govern the memory channel only. The same fact may still sit in chat history or inside a document, and removing a memory does not rewrite those."
            - generic [ref=e246]:
              - heading "What went wrong" [level=4] [ref=e247]
              - paragraph [ref=e249]: I drove the research path live and it broke five ways in one session. Two of the fixes are the ones I would show anybody. The service was serving content-free completions as answers — an empty response from the model became an empty answer to the owner — so it now raises instead. And it would run web searches against a plan that had already degraded, spending budget to enrich something it had no confidence in. It no longer does.
