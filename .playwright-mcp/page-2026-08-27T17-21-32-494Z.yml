            - paragraph [ref=e84]: 0.45 — Vanguard — edge computer vision — solo build
            - heading "10,291 faces seen. 2,676 good enough to trust." [level=3] [ref=e85]: 10,291 faces seen.2,676 good enough to trust.
            - generic [ref=e86]:
              - paragraph [ref=e87]: Cameras watch a workspace. An edge box with no internet detects every face, measures whether that face is good enough to trust, and only then matches it against an enrolled identity. The output is an attendance record nobody had to clock in for.
              - paragraph [ref=e88]: "Face recognition demos are easy. Face recognition that runs all night on a $200 TPU, on people walking past at an angle, fails constantly. So the product is built around the failure rather than around the match: of 10,291 faces the camera found, 2,676 cleared the quality gate. That 26% survival rate is the main screen, not a footnote. Every rejected face shows the measurement that killed it and the limit it was measured against, and an operator who thinks the system is missing people can move that limit and watch the numbers move."
              - paragraph [ref=e89]: Four networks run on the device — YOLOv8n, YOLOv8-face, WHENet and ArcFace R50 — chained through Kafka across three processes into one Postgres. A face reaches an identity only by passing every gate, in order.
            - generic [ref=e90]:
              - heading "The constraint" [level=4] [ref=e91]
              - paragraph [ref=e93]:
                - text: No public ONNX export exists for WHENet or YOLOv8-face. The same code has to run on the device's TPU and on a laptop, so I reproduced the device's preprocessing step for step — including ArcFace's
                - code [ref=e94]: x / 127.5 − 1.0
                - text: ", scale-then-offset, not"
                - code [ref=e95]: (x − 127.5) / 128
                - text: . Where a substitute model stands in, the config says so and states that thresholds tuned there do not transfer. Naming the TPU without the SDK fails loudly rather than falling back to CPU, because a silent fallback looks like a working TPU running orders of magnitude slower.
            - generic [ref=e96]:
              - heading "What went wrong" [level=4] [ref=e97]
              - generic [ref=e98]:
                - paragraph [ref=e99]:
                  - text: Gate state lives in memory and the detector restarts by design. My synthetic track-id counter always started at −1, so the first unnamed visit after a restart got the same −1 as the last one before it. The backend clusters on
                  - code [ref=e100]: track:<id>:<5-minute bucket>
                  - text: — so a restart inside one bucket merged two unrelated people into one person.
                - paragraph [ref=e101]: "I replaced the counter with a random per-process seed counting down from the int32 floor. Before the gate existed, an unnamed detection became its own singleton: noisy, but never a wrong merge. That is the better failure of the two, and the fix chose it deliberately."
