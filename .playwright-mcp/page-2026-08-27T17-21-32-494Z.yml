    - region [ref=e368]:
      - generic [ref=e369]:
        - heading "About" [level=2] [ref=e370]
        - generic [ref=e371]:
          - paragraph [ref=e372]: I am an AI/ML engineer in Lahore, working remotely. I build the parts of a system that decide whether a model's output is good enough to act on — quality gates, routers, evaluation harnesses, budgets, and the interfaces that let a non-engineer see why the machine did what it did.
          - paragraph [ref=e373]: The pattern across everything above is refusal. A face that fails a gate does not reach an identity. A content-free completion raises instead of becoming an answer. A degraded plan does not get a web search. A deleted fact does not come back. A restart mints a new id rather than reusing one, because a noisy singleton is a better failure than a wrong merge.
          - paragraph [ref=e374]: I have taught this too. At Information Technology University I ran graduate-level Agentic AI sessions twice a week for a cohort of 40+, on multi-agent orchestration and RAG deployment, and reviewed student systems for whether they would survive production rather than whether they demoed well. I studied there too — BSCS, 2021 to 2025.
          - paragraph [ref=e375]: Currently AI engineer at Ecommerce Steem. Before that, QUIDSol, where Vanguard and Nexis were built.
