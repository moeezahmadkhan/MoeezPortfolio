        - article [ref=e305]:
          - generic:
            - paragraph [ref=e306]: 11×w — Nexis — LLM scoring — built with one other engineer
            - heading "The composite is arithmetic. Only the parts are learned." [level=3] [ref=e307]: The composite is arithmetic.Only the parts are learned.
            - generic [ref=e308]:
              - paragraph [ref=e309]: "Nexis reads a pitch deck and turns it into a scored, comparable deal record. Anyone can ask a model to score a startup; the number that comes back is a vibe. This one is decomposed instead: eleven dimensions, each scored by its own call against its own rubric, then combined by fixed weights written in code. The model never produces the total. Traction is 11%, business model 10.5%, market, team, unit economics and defensibility 10% each, and a quarter of the score is structural — including completeness, so a deck that cannot be read costs itself points."
              - paragraph [ref=e310]: I did not write those rubrics. I made them portable.
              - paragraph [ref=e311]: Every model id in the seven-stage pipeline reads from the environment, and the service speaks to any OpenAI-compatible gateway rather than one vendor — so a stage can move from GPT-4.1 to something cheaper without touching a prompt. Cost is tracked per model with a separate rate for cached prompt tokens, which means a scoring run has a known price rather than an estimated one.
            - generic [ref=e312]:
              - heading "The constraint" [level=4] [ref=e313]
              - paragraph [ref=e315]: Cost accounting had to survive models it had never heard of. The moment ids came from the environment, a gateway-namespaced name reached a tokenizer that did not recognise it and took the run down with it. Token counting now degrades instead of raising, so an unknown model costs you a cost figure, not a scoring run.
            - generic [ref=e316]:
              - heading "What went wrong, and whose it was" [level=4] [ref=e317]
              - paragraph [ref=e319]: The scores came back generous. They bunched near the top and stopped separating deals, which is the failure mode of every LLM judge given a rubric and no calibration. The client noticed before we did, and the rubrics were re-cut twice in three days. That work was my colleague's, not mine, and the fix lives in prompts I did not write.
