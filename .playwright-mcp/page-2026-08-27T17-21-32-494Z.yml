        - article [ref=e151]:
          - generic:
            - paragraph [ref=e152]: 93.0% — Sumero Health — clinical LLM — I own the AI service
            - heading "214 prompts graded. 22 criticals still open." [level=3] [ref=e153]: 214 prompts graded.22 criticals still open.
            - generic [ref=e154]:
              - paragraph [ref=e155]: Ero is the assistant inside Sumero Health. It reads a member's lab panels and wearable data and answers questions about them. The hard part is not the answer. It is deciding, before answering, whether this message is an emergency, whether it needs an intake interview, and whether the record actually contains what the answer is about to claim.
              - paragraph [ref=e156]: So the first thing I built after the assistant was the thing that grades it. A router sorts every message into emergency, urgent or routine — 174 of 187 test prompts correctly, and the miss that matters, an emergency read as routine, happens in 3 of 103 emergency prompts. A 214-prompt graded set across 20 categories put the assistant at 124 pass, 58 partial and 32 fail in June. A 179-case regression suite in August, written to attack the specific things that broke, put it at 133 pass, 24 fail and 22 critical.
              - paragraph [ref=e157]: The 22 are still open. They are listed in the repository with the failing prompt, the delivered answer and the assertion it violated.
            - generic [ref=e158]:
              - heading "The constraint" [level=4] [ref=e159]
              - paragraph [ref=e161]: Clinical safety, on a stack where the model is not the last word. The public API and the AI service are separate processes; port 8001 is never exposed, and every call into it carries a shared secret. Answers pass through deterministic scrubbers before a member sees them.
            - generic [ref=e162]:
              - heading "What went wrong" [level=4] [ref=e163]
              - generic [ref=e164]:
                - paragraph [ref=e165]: The model started authoring its own disclaimers — verbose, redundant footers under every answer. I now strip any non-canonical footer deterministically on both the streaming and non-streaming paths, tell the model in the persona not to write one, and append a single approved line in the application.
                - paragraph [ref=e166]: Then a boundary bug. By the way i started doing crossfit recently was pulled into a symptom intake, and the assistant asked about discomfort during those sessions. The preference-statement veto covered diet and status but not new-activity disclosures, so they fell through to the coaching catch-all. I extended it to cover exercise. A symptom-paired disclosure — started crossfit and my knee hurts — still interviews, because the veto only fires after every symptom tier.
                - paragraph [ref=e167]: The third was my harness lying to me. The battery's first run reported 15 leaky disclaimers. All 15 were the approved footer, matched by a detector that required an italics wrapper the model does not write. I fixed the detector before I fixed anything else, then re-ran for a true 31 of 31.
